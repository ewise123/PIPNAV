# PipNav as a herdr plugin: a project browser and launcher pane living beside
# your agents. Link it with:  herdr plugin link /path/to/PIPNAV
id = "pipnav.launcher"
name = "PipNav"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[panes]]
id = "browser"
title = "PipNav"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/herdr/pipnav-pane.sh\""]
placement = "split"
direction = "right"
